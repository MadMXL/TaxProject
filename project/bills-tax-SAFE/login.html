<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16233E">
  <title>Sign in · Baigamgab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    try {
      var m = localStorage.getItem('appMode');
      if (m === 'dark' || (!m && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#EAF0F8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/>
        </svg>
      </span>
      <span><span class="brand-name">Baigamgab</span> <span class="brand-sub">SmartLedger</span></span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Enter your credentials to continue</p>

    <div class="alert-err hidden" id="errorMsg" style="margin-bottom:14px;"></div>

    <form id="loginForm" class="util-row">
      <div class="field">
        <span class="field-label">Email</span>
        <input class="input" type="email" id="email" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="field">
        <span class="field-label">Password</span>
        <input class="input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="margin-top:4px;">Sign in</button>
    </form>
  </div>
</div>

<script>
  let firebaseReady = false;
  let auth, db;
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyDeVDOI9RfjY9BKrpRBmueg8GBRjAG2lbc",
      authDomain: "baigumgub.firebaseapp.com",
      databaseURL: "https://baigumgub-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "baigumgub",
      storageBucket: "baigumgub.firebasestorage.app",
      messagingSenderId: "499376326897",
      appId: "1:499376326897:web:b3a2ab6f883d4a19178150"
    });
    auth = firebase.auth();
    db   = firebase.database();
    firebaseReady = true;
    auth.onAuthStateChanged(user => { if (user) checkFirebaseRole(user); });
  } catch (e) {}

  function setSession(uid, email, role, name) {
    sessionStorage.setItem('userId', uid);
    sessionStorage.setItem('userEmail', email);
    sessionStorage.setItem('userRole', role);
    sessionStorage.setItem('userName', name);
    const _qp = new URLSearchParams(window.location.search).get('doc');
    window.location.href = 'index.html' + (_qp ? '?doc=' + _qp : '');
  }

  async function checkFirebaseRole(user) {
    try {
      const snap = await db.ref('users/' + user.uid).once('value');
      const data = snap.val();
      if (data) setSession(user.uid, user.email, data.role || 'sales', data.name || user.email);
    } catch (e) {}
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    document.getElementById('errorMsg').classList.add('hidden');
    btn.disabled = true; btn.textContent = 'Signing in…';

    if (firebaseReady) {
      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const snap = await db.ref('users/' + cred.user.uid).once('value');
        const data = snap.val() || {};
        setSession(cred.user.uid, email, data.role || 'sales', data.name || email.split('@')[0]);
        return;
      } catch (err) {
        const msgs = {
          'auth/user-not-found':     'No account found with this email.',
          'auth/wrong-password':     'Incorrect password.',
          'auth/invalid-credential': 'Incorrect email or password.',
          'auth/too-many-requests':  'Too many attempts. Try again later.',
        };
        showError(msgs[err.code] || 'Sign in failed. Please try again.');
      }
    } else {
      showError('Incorrect email or password.');
    }
    btn.disabled = false; btn.textContent = 'Sign in';
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16233E">
  <title>Baigamgab · SmartLedger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    // Apply saved theme before first paint to avoid a flash
    try {
      var m = localStorage.getItem('appMode');
      if (m === 'dark' || (!m && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-3);">Loading…</div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/functions.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    // ── AUTH GUARD ────────────────────────────────────────────
    const _role  = sessionStorage.getItem('userRole');
    const _email = sessionStorage.getItem('userEmail');

    if (!_role || !_email) {
      const _doc = new URLSearchParams(window.location.search).get('doc');
      window.location.href = 'login.html' + (_doc ? '?doc=' + _doc : '');
    }

    window.logout = async function() {
      try {
        if (typeof firebase !== 'undefined' && firebase.auth) {
          await firebase.auth().signOut();
        }
      } catch (e) {}
      sessionStorage.clear();
      window.location.href = 'login.html';
    };

    // Role is assigned by Admin in Firebase only — read-only in the app.
    window.toggleRole = function() {
      alert('Role switching is disabled. Your role is assigned by the Admin.');
    };
  </script>
</body>
</html>
